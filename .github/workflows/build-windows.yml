name: Build Windows Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Install Flutter
        shell: pwsh
        run: |
          # Download Flutter 3.22.3 (stable, well-tested)
          $flutterUrl = "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_3.22.3-stable.zip"
          Write-Host "Downloading Flutter from $flutterUrl"
          Invoke-WebRequest -Uri $flutterUrl -OutFile flutter.zip -UseBasicParsing
          Write-Host "Extracting Flutter..."
          Expand-Archive -Path flutter.zip -DestinationPath C:\ -Force
          # Add to PATH for subsequent steps
          "C:\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      
      - name: Flutter version and doctor
        shell: pwsh
        run: |
          C:\flutter\bin\flutter --version
          C:\flutter\bin\flutter doctor -v
      
      - name: Enable Windows desktop
        shell: pwsh
        run: C:\flutter\bin\flutter config --enable-windows-desktop
      
      - name: Get dependencies
        shell: pwsh
        run: C:\flutter\bin\flutter pub get
      
      - name: Build Windows release
        shell: pwsh
        run: C:\flutter\bin\flutter build windows --release
      
      - name: List build output
        shell: pwsh
        run: |
          if (Test-Path "build\windows\x64\runner\Release") {
            Get-ChildItem -Path "build\windows\x64\runner\Release" -Recurse
          } else {
            Write-Host "Build directory not found!"
            Get-ChildItem -Path "build" -Recurse -ErrorAction SilentlyContinue
          }
      
      - name: Zip the release
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath StockPilot-Windows.zip
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockPilot-Windows
          path: StockPilot-Windows.zip
          retention-days: 30