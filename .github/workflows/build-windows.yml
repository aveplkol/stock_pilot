name: Build Windows Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.2
      
      - name: Flutter doctor
        run: flutter doctor -v
      
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build Windows release
        run: flutter build windows --release
      
      - name: List build output
        shell: pwsh
        run: |
          if (Test-Path "build\windows\x64\runner\Release") {
            Get-ChildItem -Path "build\windows\x64\runner\Release" -Recurse
          } else {
            Write-Host "Build directory not found!"
            Get-ChildItem -Path "build" -Recurse -ErrorAction SilentlyContinue
          }
      
      - name: Zip the release
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath StockPilot-Windows.zip
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockPilot-Windows
          path: StockPilot-Windows.zip
          retention-days: 30